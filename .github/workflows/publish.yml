name: Publish

# Every push to main is verified (typecheck + tests) and, when the version in
# package.json is not on npm yet, published. A merge that doesn't bump the
# version is a no-op, so releasing = bumping the version in the PR.
#
# Auth is npm trusted publishing (OIDC): no token is stored in this repo. The
# package's trusted publisher on npmjs.com must name this repo and this file
# (`publish.yml`) and allow direct `npm publish`. Provenance is attached
# automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Verify
        run: |
          npm run check
          npm test

      - name: Check whether this version is already on npm
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not on npm yet — publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly rebuilds from a clean dist/ and reruns the tests.
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish
